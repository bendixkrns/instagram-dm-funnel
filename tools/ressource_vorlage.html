<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{TITEL_TEXT}}</title>
<style>
@font-face { font-family: "HN"; src: url("{{FONT_BOLD}}"); font-weight: 700; }
@font-face { font-family: "HN"; src: url("{{FONT_REGULAR}}"); font-weight: 400; }
:root { --accent:#5B4FE0; --paper:#F5F1EA; --ink:#0a0a0c; --muted:#5f5b66; --card:#ffffff; --line:#E4DED3; }
@page { size: 1080px 1350px; margin: 0; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background: var(--paper); }
body { font-family:"HN", Helvetica, Arial, sans-serif; font-weight:400; color:var(--ink); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.pg { position:relative; width:1080px; height:1350px; padding:84px 72px 150px; overflow:hidden; background:var(--paper); break-after:page; page-break-after:always; }
.pg:last-child { break-after:auto; page-break-after:auto; }
.fuss { position:absolute; left:72px; right:72px; bottom:62px; display:flex; justify-content:space-between; align-items:center; font-size:30px; color:var(--muted); }
.fuss b { color:var(--accent); font-weight:700; }
.kopf { display:flex; align-items:center; gap:22px; margin-bottom:56px; }
.logo { width:72px; height:72px; border-radius:50%; object-fit:cover; }
.kopf span { font-size:32px; font-weight:700; letter-spacing:.02em; }
.kopf span i { font-style:normal; color:var(--accent); }
h1 { font-size:92px; line-height:1.02; font-weight:700; letter-spacing:-.025em; }
h1 em { font-style:normal; color:var(--accent); }
.unter { margin-top:26px; font-size:38px; line-height:1.3; color:var(--muted); max-width:860px; }
.einl { margin-top:30px; font-size:40px; line-height:1.35; max-width:900px; }
.balken { width:96px; height:10px; border-radius:6px; background:var(--accent); margin:44px 0 48px; }
.karte { position:relative; background:var(--card); border-radius:34px; padding:44px 48px 46px 48px; margin-bottom:30px; box-shadow:0 14px 40px #2a225a14; border:2px solid #ece6da; break-inside:avoid; page-break-inside:avoid; }
.nr { position:absolute; left:48px; top:44px; width:76px; height:76px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:42px; display:grid; place-items:center; }
.karte .inh { padding-left:106px; }
.karte h2 { font-size:46px; line-height:1.12; font-weight:700; letter-spacing:-.01em; padding-top:6px; }
.karte p { margin-top:18px; font-size:37px; line-height:1.38; color:#2b2833; }
.schluss { margin-top:38px; padding:0; font-size:38px; line-height:1.38; color:var(--ink); break-inside:avoid; }
.quelle { margin-top:40px; padding-top:26px; border-top:2px solid var(--line); font-size:28px; line-height:1.4; color:var(--muted); break-inside:avoid; }
.quelle b { color:var(--ink); }
</style></head><body>
<div id="flow">
<div class="kopf">{{LOGO}}<span>The Psych<i>Note</i></span></div>
<h1>{{TITEL}}</h1>
{{UNTER}}
{{EINL}}
<div class="balken"></div>
{{KARTEN}}
{{SCHLUSS}}
{{QUELLE}}
</div>
<script>
// Seiten 1080x1350: Blöcke der Reihe nach auf Seiten verteilen (Inhaltshöhe 1350-84-150), Fuß auf jeder Seite.
(function () {
  var flow = document.getElementById("flow"), items = Array.prototype.slice.call(flow.children), MAXH = 1350 - 84 - 150;
  var fuss = '<div class="fuss"><span><b>@{{HANDLE}}</b></span><span>{{FUSS_RECHTS}}</span></div>';
  function neu() { var s = document.createElement("section"); s.className = "pg"; document.body.appendChild(s); return s; }
  var seite = neu(), h = 0;
  items.forEach(function (el) {
    seite.appendChild(el);
    var st = getComputedStyle(el), bh = el.offsetHeight + parseFloat(st.marginTop) + parseFloat(st.marginBottom);
    if (h + bh > MAXH && h > 0 && !el.classList.contains("balken")) { seite = neu(); h = 0; seite.appendChild(el); }
    h += bh;
  });
  flow.remove();
  Array.prototype.forEach.call(document.querySelectorAll(".pg"), function (p) { p.insertAdjacentHTML("beforeend", fuss); });
})();
</script>
</body></html>
